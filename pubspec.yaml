name: studyflora
description: StudyFlora - a gamified flower-garden study app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  file_picker: ^8.1.2
  syncfusion_flutter_pdf: ^26.2.14
  archive: ^3.6.1
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  url_launcher: ^6.3.0
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/flowers/
    - assets/avatars/
    - assets/tools/
