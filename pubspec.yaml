name: studyflora
description: StudyFlora - study, earn coins, and grow your Zen garden.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  file_picker: '>=8.1.0 <9.0.0'
  archive: '>=3.6.0 <4.0.0'
  syncfusion_flutter_pdf: '>=27.1.48 <30.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
